  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HAK Shopping Mart</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg:#f4f0e8;--ink:#111;--accent:#c9a84c;--gold:#b8860b;
      --card:#fff;--muted:#888;--border:#ddd;--fitness:#1a7f4b;
    }
    html{scroll-behavior:smooth;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;cursor:none;}

    /* CUSTOM CURSOR */
    #cursor{position:fixed;width:12px;height:12px;background:var(--accent);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:transform .1s,width .2s,height .2s;mix-blend-mode:multiply;}
    #cursor-ring{position:fixed;width:36px;height:36px;border:2px solid var(--accent);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:left .12s ease,top .12s ease,width .2s,height .2s;opacity:.6;}
    body:has(button:hover) #cursor{width:20px;height:20px;}
    body:has(.card:hover) #cursor-ring{width:50px;height:50px;opacity:.9;}

    /* RIPPLE */
    .ripple-container{position:relative;overflow:hidden;}
    .ripple{position:absolute;border-radius:50%;background:rgba(201,168,76,.35);transform:scale(0);animation:ripple-anim .6s linear;pointer-events:none;}
    @keyframes ripple-anim{to{transform:scale(4);opacity:0;}}

    /* NAV */
    nav{display:flex;align-items:center;justify-content:space-between;padding:.7rem 2.5rem;background:#0d0d0d;color:#fff;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,.5);}
    .logo-wrap{display:flex;align-items:center;gap:.8rem;}
    .logo-img{height:52px;width:52px;object-fit:contain;border-radius:4px;}
    .logo-text{display:flex;flex-direction:column;line-height:1.1;}
    .logo-text .l1{font-family:'Syne',sans-serif;font-size:.75rem;letter-spacing:3px;color:var(--accent);}
    .logo-text .l2{font-family:'Syne',sans-serif;font-size:1rem;letter-spacing:1px;color:#fff;}
    .cart-btn{background:linear-gradient(135deg,var(--accent),var(--gold));color:#fff;border:none;padding:.55rem 1.4rem;font-size:.95rem;cursor:none;font-family:'DM Sans',sans-serif;font-weight:600;display:flex;align-items:center;gap:.5rem;transition:all .25s;letter-spacing:.5px;}
    .cart-btn:hover{transform:scale(1.05);box-shadow:0 4px 18px rgba(201,168,76,.5);}
    #cart-count{background:#fff;color:var(--gold);border-radius:50%;width:20px;height:20px;font-size:.75rem;display:grid;place-items:center;font-weight:800;}

    /* HERO */
    .hero{text-align:center;padding:4rem 1rem 3rem;background:linear-gradient(135deg,#0d0d0d 55%,#3a2800 100%);clip-path:ellipse(100% 82% at 50% 0%);position:relative;overflow:hidden;}
    .hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 70% 50%,rgba(201,168,76,.15) 0%,transparent 70%);}
    .hero h1{font-family:'Syne',sans-serif;font-size:clamp(2.2rem,6vw,4.5rem);color:#fff;line-height:1.1;position:relative;}
    .hero h1 span{color:var(--accent);}
    .hero p{color:#bbb;margin-top:.7rem;font-size:1rem;position:relative;}
    .hero-tag{display:inline-block;background:rgba(201,168,76,.15);border:1px solid var(--accent);color:var(--accent);font-size:.72rem;letter-spacing:2px;padding:.3rem .9rem;margin-bottom:1rem;position:relative;}

    /* FILTERS */
    .filters{display:flex;gap:.6rem;justify-content:center;padding:1.8rem 1rem .8rem;flex-wrap:wrap;}
    .filter-btn{padding:.4rem 1.1rem;border:1.5px solid var(--ink);background:transparent;font-family:'DM Sans',sans-serif;font-size:.85rem;cursor:none;transition:all .25s;position:relative;overflow:hidden;}
    .filter-btn::after{content:'';position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .25s;z-index:-1;}
    .filter-btn:hover::after,.filter-btn.active::after{transform:scaleX(1);}
    .filter-btn:hover,.filter-btn.active{color:#fff;}
    .filter-btn.fitness-btn{border-color:var(--fitness);color:var(--fitness);}
    .filter-btn.fitness-btn::after{background:var(--fitness);}
    .filter-btn.fitness-btn:hover,.filter-btn.fitness-btn.active{color:#fff;}

    /* SUB FILTERS */
    .subfilters{display:flex;gap:.5rem;justify-content:center;padding:.4rem 1rem 1rem;flex-wrap:wrap;min-height:2.8rem;}
    .sub-btn{padding:.3rem .9rem;border:1px solid var(--border);background:#fff;font-family:'DM Sans',sans-serif;font-size:.78rem;cursor:none;transition:all .25s;color:var(--muted);border-radius:20px;}
    .sub-btn:hover,.sub-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);transform:translateY(-2px);}

    /* SECTION LABEL */
    .section-label{font-family:'Syne',sans-serif;font-size:1.3rem;padding:.5rem 0 .2rem 1rem;border-left:4px solid var(--accent);margin:.5rem 2.5rem 0;animation:slideIn .3s ease;}
    .section-label.fitness{border-color:var(--fitness);color:var(--fitness);}
    @keyframes slideIn{from{opacity:0;transform:translateX(-20px);}to{opacity:1;transform:translateX(0);}}

    /* GRID */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.4rem;padding:1rem 2.5rem 3rem;}

    /* CARD */
    .card{background:var(--card);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.25,.8,.25,1),box-shadow .3s;cursor:none;animation:fadeUp .4s ease both;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
    .card:hover{transform:translateY(-6px) scale(1.01);box-shadow:0 16px 40px rgba(0,0,0,.14);}
    .card-img{width:100%;aspect-ratio:1;background:linear-gradient(135deg,#f7f7f7,#efefef);font-size:4rem;display:flex;align-items:center;justify-content:center;transition:transform .3s;}
    .card:hover .card-img{transform:scale(1.08);}
    .card-body{padding:1rem;flex:1;display:flex;flex-direction:column;gap:.3rem;}
    .card-tag{font-size:.68rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
    .card-brand{font-size:.78rem;font-weight:700;color:var(--accent);}
    .card-name{font-family:'Syne',sans-serif;font-size:.95rem;line-height:1.3;}
    .card-desc{font-size:.75rem;color:var(--muted);}
    .card-price{font-size:1.15rem;font-weight:600;color:var(--ink);margin-top:auto;padding-top:.5rem;}
    .add-btn{width:100%;padding:.65rem;border:none;background:var(--ink);color:#fff;font-family:'DM Sans',sans-serif;font-size:.9rem;cursor:none;margin-top:.6rem;transition:all .25s;font-weight:500;position:relative;overflow:hidden;}
    .add-btn:hover{background:var(--accent);letter-spacing:.5px;}
    .add-btn.added{background:#28a745;}
    .card.fitness-card .add-btn{background:var(--fitness);}
    .card.fitness-card .add-btn:hover{background:#145f38;}
    .badge{display:inline-block;font-size:.65rem;padding:.15rem .5rem;border-radius:3px;margin-bottom:.2rem;font-weight:700;}
    .badge-new{background:#fff3cd;color:#856404;}
    .badge-hot{background:#fde8e8;color:#c0392b;}
    .badge-best{background:#e8f5e9;color:#1a7f4b;}

    /* CART SIDEBAR */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;backdrop-filter:blur(2px);}
    .overlay.open{display:block;}
    .sidebar{position:fixed;right:-420px;top:0;height:100%;width:380px;background:#fff;z-index:300;display:flex;flex-direction:column;box-shadow:-8px 0 32px rgba(0,0,0,.2);transition:right .35s cubic-bezier(.25,.8,.25,1);}
    .sidebar.open{right:0;}
    .sidebar-head{display:flex;align-items:center;justify-content:space-between;padding:1.2rem 1.5rem;border-bottom:1px solid var(--border);font-family:'Syne',sans-serif;font-size:1.2rem;background:#0d0d0d;color:#fff;}
    .close-btn{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;font-size:1rem;cursor:none;padding:.2rem .6rem;transition:all .2s;}
    .close-btn:hover{background:rgba(255,255,255,.2);}
    .cart-items{flex:1;overflow-y:auto;padding:1rem 1.5rem;}
    .cart-empty{color:var(--muted);text-align:center;margin-top:3rem;}
    .cart-item{display:flex;align-items:center;gap:1rem;padding:.8rem 0;border-bottom:1px solid var(--border);animation:fadeUp .3s ease;}
    .ci-emoji{font-size:2rem;min-width:2.5rem;text-align:center;}
    .ci-info{flex:1;}
    .ci-name{font-weight:500;font-size:.85rem;}
    .ci-price{color:var(--accent);font-size:.83rem;font-weight:600;}
    .ci-qty{display:flex;align-items:center;gap:.4rem;margin-top:.3rem;}
    .qty-btn{background:var(--bg);border:1px solid var(--border);width:26px;height:26px;cursor:none;font-size:1rem;transition:all .2s;}
    .qty-btn:hover{background:var(--ink);color:#fff;}
    .ci-remove{background:none;border:none;color:var(--muted);cursor:none;font-size:1rem;transition:color .2s;}
    .ci-remove:hover{color:#e84c1e;}
    .cart-footer{padding:1rem 1.5rem;border-top:1px solid var(--border);}
    .total-row{display:flex;justify-content:space-between;font-family:'Syne',sans-serif;font-size:1.1rem;margin-bottom:1rem;}
    .checkout-btn{width:100%;padding:.85rem;background:linear-gradient(135deg,var(--accent),var(--gold));color:#fff;border:none;font-size:1rem;font-family:'DM Sans',sans-serif;cursor:none;font-weight:700;letter-spacing:.5px;transition:all .25s;}
    .checkout-btn:hover{opacity:.88;transform:translateY(-2px);box-shadow:0 4px 16px rgba(201,168,76,.4);}

    /* TOAST */
    .toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);background:#0d0d0d;color:#fff;padding:.7rem 1.6rem;font-size:.9rem;opacity:0;transition:all .35s cubic-bezier(.25,.8,.25,1);z-index:999;border-left:3px solid var(--accent);}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    /* PAGE LOADER */
    .loader{position:fixed;inset:0;background:#0d0d0d;display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s,visibility .5s;}
    .loader.hide{opacity:0;visibility:hidden;}
    .loader-logo{font-family:'Syne',sans-serif;font-size:2rem;color:var(--accent);letter-spacing:4px;animation:pulse 1s ease infinite;}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

    @media(max-width:600px){.grid{padding:1rem;}.section-label{margin:.5rem 1rem 0;}nav{padding:.7rem 1rem;}.logo-img{height:40px;width:40px;}}
  </style>
</head>
<body>

<!-- LOADER -->
<div class="loader" id="loader"><div class="loader-logo">HAK</div></div>

<!-- CURSOR -->
<div id="cursor"></div>
<div id="cursor-ring"></div>

<!-- NAV -->
<nav>
  <div class="logo-wrap">
    <img class="logo-img" id="logo-img" alt="HAK Logo"/>
    <div class="logo-text">
      <span class="l1">HARSH · AYUSH · KISHAN</span>
      <span class="l2">SHOPPING MART</span>
    </div>
  </div>
  <button class="cart-btn ripple-container" onclick="toggleCart()">🛒 Cart <span id="cart-count">0</span></button>
</nav>

<!-- HERO -->
<div class="hero">
  <div class="hero-tag">PREMIUM COLLECTION 2025</div>
  <h1>Shop Without<br/><span>Limits</span></h1>
  <p>Premium picks. Real prices. Zero compromise. 🔥</p>
</div>

<!-- FILTERS -->
<div class="filters">
  <button class="filter-btn active ripple-container" onclick="setCategory('all',this)">🛍️ All</button>
  <button class="filter-btn ripple-container" onclick="setCategory('electronics',this)">📱 Electronics</button>
  <button class="filter-btn ripple-container" onclick="setCategory('fashion',this)">👗 Fashion</button>
  <button class="filter-btn ripple-container" onclick="setCategory('food',this)">🍕 Food</button>
  <button class="filter-btn ripple-container" onclick="setCategory('home',this)">🏠 Home</button>
  <button class="filter-btn fitness-btn ripple-container" onclick="setCategory('fitness',this)">💪 My Fitness</button>
</div>

<div class="subfilters" id="subfilters"></div>
<div id="section-label" style="display:none" class="section-label"></div>
<div class="grid" id="grid"></div>

<div class="overlay" id="overlay" onclick="toggleCart()"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-head">🛒 Your Cart <button class="close-btn" onclick="toggleCart()">✕ Close</button></div>
  <div class="cart-items" id="cart-items"><p class="cart-empty">Your cart is empty.<br/>🛍️ Start shopping!</p></div>
  <div class="cart-footer">
    <div class="total-row"><span>Total</span><span id="total">₹0</span></div>
    <button class="checkout-btn ripple-container" onclick="checkout()">Proceed to Checkout →</button>
  </div>
</div>

<div class="toast" id="toast"></div>

// ── CURSOR ──
const cur = document.getElementById('cursor');
const ring = document.getElementById('cursor-ring');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cur.style.left=mx+'px';cur.style.top=my+'px';});
(function animRing(){rx+=(mx-rx)*.12;ry+=(my-ry)*.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(animRing);})();

// ── RIPPLE ──  (thoda hard hai )
document.addEventListener('click',e=>{           
  const el=e.target.closest('.ripple-container');
  if(!el)return;
  const r=document.createElement('span');
  r.className='ripple';
  const rect=el.getBoundingClientRect();
  const size=Math.max(rect.width,rect.height);
  r.style.cssText=`width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
  el.appendChild(r);
  setTimeout(()=>r.remove(),700);
});

const subMap={
  electronics:[{key:"apple",label:"🍎 Apple"},{key:"android",label:"🤖 Android"},{key:"accessory",label:"🎧 Accessories"}],
  fashion:[{key:"shoes",label:"👟 Shoes"},{key:"sunnies",label:"🕶️ Sunglasses"},{key:"clothing",label:"👕 Clothing"}],
  food:[{key:"pizza",label:"🍕 Pizza"},{key:"burger",label:"🍔 Burger"},{key:"oats",label:"🥣 Oats"}],
  home:[{key:"perfume",label:"🌊 Perfume"},{key:"bedsheet",label:"🛏️ Bed Sheet"},{key:"decor",label:"🏮 Decor"}],
  fitness:[{key:"gainer",label:"⚖️ Weight Gainer"},{key:"creatine",label:"🧪 Creatine"},{key:"whey",label:"🥛 Whey Protein"},{key:"extras",label:"⚡ Extras"}],
};
const catLabels={electronics:"📱 Electronics",fashion:"👗 Fashion",food:"🍕 Food & Drinks",home:"🏠 Home & Living",fitness:"💪 My Fitness Store"};

let cart={},currentCat='all',currentSub='all';

function setCategory(cat,el){
  currentCat=cat;currentSub='all';
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderSubs(cat);renderProducts();
  const lbl=document.getElementById('section-label');
  if(cat==='all'){lbl.style.display='none';return;}
  lbl.style.display='block';lbl.textContent=catLabels[cat]||'';
  lbl.className='section-label'+(cat==='fitness'?' fitness':'');
}
function renderSubs(cat){
  const box=document.getElementById('subfilters');
  if(!subMap[cat]){box.innerHTML='';return;}
  box.innerHTML=subMap[cat].map(s=>`<button class="sub-btn ripple-container" onclick="setSub('${s.key}',this)">${s.label}</button>`).join('');
}
function setSub(sub,el){
  currentSub=sub;
  document.querySelectorAll('.sub-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');renderProducts();
}
function renderProducts(){
  let list=products;
  if(currentCat!=='all')list=list.filter(p=>p.category===currentCat);
  if(currentSub!=='all')list=list.filter(p=>p.sub===currentSub);
  const grid=document.getElementById('grid');
  grid.innerHTML=list.map((p,i)=>{
    const bdg=p.badge?`<span class="badge badge-${p.badge}">${p.badge.toUpperCase()}</span>`:'';
    return `<div class="card ripple-container ${p.category==='fitness'?'fitness-card':''}" style="animation-delay:${i*0.04}s">
      <div class="card-img">${p.emoji}</div>
      <div class="card-body">
        ${bdg}
        <div class="card-brand">${p.brand}</div>
        <div class="card-tag">${p.sub}</div>
        <div class="card-name">${p.name}</div>
        <div class="card-desc">${p.desc}</div>
        <div class="card-price">₹${p.price.toLocaleString('en-IN')}</div>
        <button class="add-btn ripple-container" id="btn-${p.id}" onclick="addToCart(${p.id})">Add to Cart</button>
      </div>
    </div>`;
  }).join('');
}
function addToCart(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  cart[id]=cart[id]?{...cart[id],qty:cart[id].qty+1}:{...p,qty:1};
  updateCartUI();
  const btn=document.getElementById('btn-'+id);
  if(btn){btn.textContent='✓ Added!';btn.classList.add('added');setTimeout(()=>{btn.textContent='Add to Cart';btn.classList.remove('added');},1300);}
  showToast(`${p.emoji} ${p.name} added to cart!`);
}
function removeFromCart(id){delete cart[id];updateCartUI();}
function changeQty(id,delta){
  if(!cart[id])return;
  cart[id].qty+=delta;
  if(cart[id].qty<=0)delete cart[id];
  updateCartUI();
}
function updateCartUI(){
  const items=Object.values(cart);
  document.getElementById('cart-count').textContent=items.reduce((s,x)=>s+x.qty,0);
  document.getElementById('total').textContent='₹'+items.reduce((s,x)=>s+x.price*x.qty,0).toLocaleString('en-IN');
  const box=document.getElementById('cart-items');
  box.innerHTML=items.length?items.map(x=>`
    <div class="cart-item">
      <div class="ci-emoji">${x.emoji}</div>
      <div class="ci-info">
        <div class="ci-name">${x.brand} ${x.name}</div>
        <div class="ci-price">₹${(x.price*x.qty).toLocaleString('en-IN')}</div>
        <div class="ci-qty">
          <button class="qty-btn" onclick="changeQty(${x.id},-1)">−</button>
          <span>${x.qty}</span>
          <button class="qty-btn" onclick="changeQty(${x.id},1)">+</button>
        </div>
      </div>
      <button class="ci-remove" onclick="removeFromCart(${x.id})">🗑</button>
    </div>`).join(''):'<p class="cart-empty">Your cart is empty.<br/>🛍️ Start shopping!</p>';
}
function toggleCart(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}
function checkout(){
  if(!Object.keys(cart).length)return showToast('🛒 Cart is empty!');
  cart={};updateCartUI();toggleCart();
  showToast('🎉 Order placed! Thank you for shopping with HAK!');
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

// INIT
window.addEventListener('load',()=>{
  setTimeout(()=>document.getElementById('loader').classList.add('hide'),1000);
});
renderProducts();
